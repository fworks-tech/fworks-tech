name: Update README

on:
  schedule:
    - cron: "0 8 * * *"   # daily at 08:00 UTC
  workflow_dispatch:        # allow manual trigger from the Actions tab

concurrency:
  group: update-readme
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false

      - name: Run unit tests
        run: python3 scripts/test_update_readme.py

      - name: Run README updater
        id: update
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: python3 scripts/update_readme.py

      - name: Close legacy auto-update PRs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for pr in $(gh pr list --repo fworks-tech/fworks-tech --state open --json number,headRefName --jq '.[] | select(.headRefName | startswith("chore/auto-update-readme-")) | .number'); do
            gh pr close "$pr" --repo fworks-tech/fworks-tech --comment "Superseded by the reusable auto-update PR."
          done

      - name: Publish README update
        if: steps.update.outputs.changed == '1'
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          base: main
          branch: chore/auto-update-readme
          delete-branch: true
          add-paths: README.md
          commit-message: |
            chore(readme): auto-update profile [skip ci]

            Refreshed Featured Projects dates and Recent Activity from the GitHub API and OpenCode.
          title: "chore(readme): auto-update profile"
          body-path: scripts/update_summary.txt
          labels: documentation
          assignees: fworks-tech
