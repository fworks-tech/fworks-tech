name: Update README

on:
  schedule:
    - cron: "0 8 * * *"   # daily at 08:00 UTC
  workflow_dispatch:        # allow manual trigger from the Actions tab

concurrency:
  group: update-readme
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run unit tests
        run: python3 scripts/test_update_readme.py

      - name: Run README updater
        id: update
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: python3 scripts/update_readme.py

      - name: Close legacy auto-update PRs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for pr in $(gh pr list --repo fworks-tech/fworks-tech --state open --json number,headRefName --jq '.[] | select(.headRefName | startswith("chore/auto-update-readme-")) | .number'); do
            gh pr close "$pr" --repo fworks-tech/fworks-tech --comment "Superseded by the reusable auto-update PR."
          done

      - name: Publish README update
        if: steps.update.outputs.changed == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="chore/auto-update-readme"
          TITLE="chore(readme): auto-update recent activity"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add README.md
          if git diff --cached --quiet; then
            echo "No README changes to commit; skipping PR."
            exit 0
          fi
          git commit -m "$TITLE [skip ci]" -m "Refreshed from the GitHub API and OpenCode by the update-readme workflow."
          git push --force origin "$BRANCH"
          EXISTING=$(gh pr list --repo fworks-tech/fworks-tech --state open --head "$BRANCH" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh pr edit "$EXISTING" --title "$TITLE" --body-file scripts/update_summary.txt
            echo "PR #$EXISTING updated."
          else
            gh pr create \
              --repo fworks-tech/fworks-tech \
              --base main \
              --head "$BRANCH" \
              --assignee fworks-tech \
              --label documentation \
              --title "$TITLE" \
              --body-file scripts/update_summary.txt
            echo "PR created on branch $BRANCH"
          fi
