name: PR Standards
on:
  pull_request:
    types: [opened, synchronize, edited, reopened, ready_for_review]
    branches: [main]

permissions:
  contents: read

jobs:
  commitlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if ! echo "$PR_TITLE" | grep -qE '^(feat|fix|docs|test|refactor|ci|chore)(\(.+\))?: .+'; then
            echo "PR title must follow Conventional Commits: type(scope): subject"
            exit 1
          fi

  python-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Check Python syntax
        run: python3 -m py_compile scripts/update_readme.py
      - name: Run unit tests
        run: python3 scripts/test_update_readme.py

  readme-table:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify README has required sections
        run: |
          for section in "Featured Projects" "Tech Stack" "Contact"; do
            if ! grep -q "## $section" README.md; then
              echo "Missing section: $section"
              exit 1
            fi
          done
          if ! grep -qE '^\| Repository \| Description \| Last Update \|$' README.md; then
            echo "Featured Projects table must include a Last Update column"
            exit 1
          fi
